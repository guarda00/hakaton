name: hakaton
recipe: pantheon
config:
  site: hakaton
  id: 59931b5c-b0fa-45bd-bba7-698d8889c3c4
  framework: drupal8
services:
  appserver:
    xdebug: true
    overrides:
      environment:
        XDEBUG_MODE: debug
        XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003"
        PHP_IDE_CONFIG: "serverName=lando"
        XDEBUG_SESSION: VSCODE
events:
  post-start:
    - appserver: /bin/sh /app/.lando/terminus-auto-login.sh
